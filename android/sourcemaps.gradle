// Uploads the release JavaScript source map to Luciq after the React Native bundle is built.
//
// This script is applied by the Luciq library module, and the Expo config plugin can also apply it
// to the app module. Either way it finds every Android application module that builds a React
// Native bundle, so hybrid apps whose app module is not named `:app` are covered too. A bundle task
// is hooked only once, whichever copy of the script reaches it first.
//
// The upload never fails the build: anything missing is logged as a warning and the upload is skipped.

// The Luciq package folder, which holds this script's `android` folder.
def luciqScriptDir = buildscript.sourceFile?.parentFile

gradle.projectsEvaluated {
    rootProject.allprojects
            .findAll { it.plugins.hasPlugin('com.android.application') }
            .each { appProject ->
                try {
                    registerUploadSourcemapsTasks(appProject, luciqScriptDir)
                } catch (exception) {
                    project.logger.warn "⚠️  Luciq couldn't set up the sourcemap upload for ${appProject.path}. " +
                            "Reason: ${exception.message}. Build will continue."
                }
            }
}

void registerUploadSourcemapsTasks(Project appProject, File luciqScriptDir) {
    // Works for both `bundleReleaseJsAndAssets` and `createBundleReleaseJsAndAssets` and product flavors
    def suffix = 'ReleaseJsAndAssets'
    def prefixes = ['bundle', 'createBundle']
    def bundleTasks = appProject.tasks.findAll { task ->
        task.name.endsWith(suffix) && prefixes.any { task.name.startsWith(it) }
    }

    bundleTasks.each { task ->
        if (task.ext.has('luciqUploadSourcemapsTask')) {
            return
        }

        def name = task.name
        def start = name.startsWith(prefixes[0]) ? prefixes[0].length() : prefixes[1].length()
        def end = name.length() - suffix.length()
        def flavor = name.substring(start, end).uncapitalize()
        def defaultVersion = getDefaultVersion(appProject, flavor)

        def uploadTask = createUploadSourcemapsTask(appProject, flavor, defaultVersion.name, defaultVersion.code, task, luciqScriptDir)
        task.ext.luciqUploadSourcemapsTask = uploadTask.path
        task.finalizedBy uploadTask
    }
}

Task createUploadSourcemapsTask(Project appProject, String flavor, String defaultVersionName, String defaultVersionCode, Task task, File luciqScriptDir) {
    // Keep the historical task name for `:app`, and add the module name for any other app module.
    def modulePart = appProject.path == ':app' ? '' : appProject.name.capitalize()
    def name = 'uploadSourcemaps' + modulePart + flavor.capitalize()

    // Don't recreate the task if it already exists.
    // This prevents the build from failing in an edge case where the user has
    // both `bundleReleaseJsAndAssets` and `createBundleReleaseJsAndAssets`
    def taskExists = tasks.getNames().contains(name)
    if (taskExists) {
        return tasks.named(name).get()
    }

    def appDir = appProject.projectDir
    def androidRootDir = appProject.rootDir
    def jsProjectDir = getJsProjectDir(appProject)

    def provider = tasks.register(name) {
        group 'luciq'
        description 'Uploads sourcemaps file to Luciq server'
        enabled = isUploadSourcemapsEnabled()

        doLast {
            try {
                def sourceMapFile = getSourceMapFile(appDir, flavor, task)

                if (!sourceMapFile) {
                    project.logger.warn "⚠️  Source map file not found. Skipping sourcemap upload."
                    return
                }

                def luciqDir = getLuciqPackageDir(luciqScriptDir, jsProjectDir)
                if (!luciqDir) {
                    project.logger.warn "⚠️  Unable to find the @luciq/react-native package. Skipping sourcemap upload."
                    return
                }

                // Hybrid apps start Luciq from native code, so the token lookup also searches the Android project.
                def tokenJsFile = new File(luciqDir, 'scripts/find-token.js')
                def inferredToken = executeNodeScript(tokenJsFile, jsProjectDir, [androidRootDir.absolutePath])

                def appToken
                try {
                    appToken = resolveVar('App Token', ['LUCIQ_APP_TOKEN'], inferredToken)
                } catch (Exception e) {
                    project.logger.warn "⚠️  ${e.message}. Skipping sourcemap upload."
                    return
                }

                def versionName
                def versionCode
                try {
                    // The README documents LUCIQ_APP_VERSION_*, which iOS reads too. LUCIQ_VERSION_* is kept for existing setups.
                    versionName = resolveVar('Version Name', ['LUCIQ_APP_VERSION_NAME', 'LUCIQ_VERSION_NAME'], defaultVersionName)
                    versionCode = resolveVar('Version Code', ['LUCIQ_APP_VERSION_CODE', 'LUCIQ_VERSION_CODE'], defaultVersionCode)
                } catch (Exception e) {
                    project.logger.warn "⚠️  ${e.message}. Skipping sourcemap upload."
                    return
                }

                println "📦 Uploading with versionName=${versionName}, versionCode=${versionCode}, appToken=${appToken.take(5)}..."

                // Run the package's own CLI rather than `npx luciq`, which depends on the working directory
                // and could fetch an unrelated `luciq` package from the registry when it isn't found locally.
                exec {
                    commandLine(
                            'node', new File(luciqDir, 'bin/index.js').absolutePath,
                            'upload-sourcemaps',
                            '--platform', 'android',
                            '--file', sourceMapFile.absolutePath,
                            '--token', appToken,
                            '--name', versionName,
                            '--code', versionCode
                    )
                }
            } catch (exception) {
                project.logger.warn "⚠️  Failed to upload source map file. Reason: ${exception.message}. Build will continue."
            }
        }
    }

    return provider.get()
}

/**
 * The JavaScript project root: the `react { root }` setting of the React Native Gradle plugin when
 * the app module sets it, else the folder above the Android project, which is the default layout.
 */
File getJsProjectDir(Project appProject) {
    try {
        def root = appProject.extensions.findByName('react')?.root?.getOrNull()?.asFile
        if (root?.isDirectory()) {
            return root
        }
    } catch (ignored) {
        // Older React Native Gradle plugins have no `root` property.
    }
    return appProject.rootDir.parentFile
}

/**
 * The installed @luciq/react-native folder. It is normally the parent of this script's folder;
 * Node's module resolution from the JavaScript project is the fallback.
 */
File getLuciqPackageDir(File luciqScriptDir, File jsProjectDir) {
    def fromScript = luciqScriptDir?.parentFile
    if (fromScript && new File(fromScript, 'bin/index.js').exists()) {
        return fromScript
    }

    try {
        def packagePath = ['node', '-p', 'require.resolve("@luciq/react-native/package.json")']
                .execute(null, jsProjectDir).text.trim()
        def packageFile = packagePath ? new File(packagePath) : null
        if (packageFile?.exists() && new File(packageFile.parentFile, 'bin/index.js').exists()) {
            return packageFile.parentFile
        }
    } catch (ignored) {
        // Node isn't available or the package can't be resolved from the JavaScript project.
    }
    return null
}

File getSourceMapFile(File appDir, String flavor, Task task) {
    def defaultFlavorPath = flavor.empty ? 'release' : "${flavor}Release"
    def defaultSourceMapDest = "build/generated/sourcemaps/react/${defaultFlavorPath}/index.android.bundle.map"
    def defaultSourceMapFile = new File(appDir, defaultSourceMapDest)
    def props = task.getProperties()

    def bundleAssetName = props.containsKey("bundleAssetName") ? props.bundleAssetName?.getOrNull() : null
    def jsSourceMapsDir = props.containsKey("jsSourceMapsDir") ? props.jsSourceMapsDir?.getOrNull() : null
    def jsIntermediateSourceMapsDir = props.containsKey("jsIntermediateSourceMapsDir") ? props.jsIntermediateSourceMapsDir?.getOrNull() : null

    if (bundleAssetName && jsSourceMapsDir) {
        def outputSourceMap = new File(jsSourceMapsDir.asFile.absolutePath, "${bundleAssetName}.map")
        if (outputSourceMap.exists()) {
            return outputSourceMap
        }
    }

    if (bundleAssetName && jsIntermediateSourceMapsDir) {
        def packagerOutputSourceMap = new File(jsIntermediateSourceMapsDir.asFile.absolutePath, "${bundleAssetName}.packager.map")
        if (packagerOutputSourceMap.exists()) {
            return packagerOutputSourceMap
        }
    }

    if (defaultSourceMapFile.exists()) {
        return defaultSourceMapFile
    }

    if (flavor.empty) {
        println "Source map file not found at: ${defaultSourceMapFile.absolutePath}. Skipping."
        return null
    }

    def fallbackSourceMapDest = "build/generated/sourcemaps/react/${flavor}/release/index.android.bundle.map"
    def fallbackSourceMapFile = new File(appDir, fallbackSourceMapDest)

    println "Unable to find source map file at: ${defaultSourceMapFile.absolutePath}.\n" +
            "Falling back to ${fallbackSourceMapFile.absolutePath}."

    if (!fallbackSourceMapFile.exists()) {
        println "Fallback source map file not found at: ${fallbackSourceMapFile.absolutePath}. Skipping."
        return null
    }

    return fallbackSourceMapFile
}

/**
 * Infers the app version to use in source map upload based on the flavor.
 * This is needed since different flavors may have different version codes and names (e.g. version suffixes).
 *
 * It checks the version for the flavor's variant.
 * If no variant is found it falls back to the app's default config.
 *
 * @param appProject The application module that builds the bundle.
 * @param flavor The flavor to get the app version for.
 * @return A map containing the version code and version name.
 */
Map<String, String> getDefaultVersion(Project appProject, String flavor) {
    def defaultConfig = appProject.android.defaultConfig

    def variants = appProject.android.applicationVariants

    // uncapitalize is used to turn "Release" into "release" if the flavor is empty
    def variantName = "${flavor}Release".uncapitalize()
    def variant = variants.find { it.name.uncapitalize() == variantName }

    def versionName = variant?.versionName ?: defaultConfig.versionName
    def versionCode = variant?.versionCode ?: defaultConfig.versionCode

    return [name: "${versionName}", code: "${versionCode}"]
}

boolean isUploadSourcemapsEnabled() {
    def luciqEnvValue = System.getenv('LUCIQ_SOURCEMAPS_UPLOAD_DISABLE')?.toBoolean()
    def instabugEnvValue = System.getenv('INSTABUG_SOURCEMAPS_UPLOAD_DISABLE')?.toBoolean()
    def defaultValue = true

    def envValue = luciqEnvValue ?: instabugEnvValue
    return (envValue != null) ? !envValue : defaultValue
}

/**
 * Resolves a value from the first set environment variable among {@code envKeys}, each also tried
 * with the legacy INSTABUG_ prefix, falling back to {@code defaultValue}.
 */
String resolveVar(String name, List<String> envKeys, String defaultValue) {
    def env = System.getenv()
    def candidateKeys = envKeys.collectMany { [it, it.replace('LUCIQ_', 'INSTABUG_')] }
    def envKey = candidateKeys.find { env.get(it) != null }
    def envValue = envKey ? env.get(envKey) : null

    if (envValue != null && defaultValue != null && envValue != defaultValue) {
        project.logger.warn "Environment variable `${envKey}` might have incorrect value, " +
                "make sure this was intentional:\n" +
                "   Environment Value: ${envValue}\n" +
                "   Default Value: ${defaultValue}"
    }

    def value = envValue ?: defaultValue

    if (value == null) {
        throw new InvalidUserDataException("Unable to find ${name}! " +
                "Set the environment variable `${envKeys.first()}` and try again.")
    }

    return value
}

static String executeNodeScript(File script, File workingDir, List<String> args = []) {
    if (!script.exists()) {
        println "Script not found: ${script.absolutePath}"
        return null
    }

    def output = new StringBuffer()
    def error = new StringBuffer()

    try {
        def process = (['node', script.getAbsolutePath()] + args).execute(null, workingDir)
        process.waitForProcessOutput(output, error)

        if (process.exitValue() != 0) {
            println "Script failed with exit code ${process.exitValue()}"
            println "Standard Error:\n${error.toString().trim()}"
            println "Standard Output:\n${output.toString().trim()}"
            return null
        }

        return output.toString().trim()

    } catch (Exception e) {
        println "Exception while executing Node.js script: ${e.message}"
        e.printStackTrace()
        return null
    }
}
