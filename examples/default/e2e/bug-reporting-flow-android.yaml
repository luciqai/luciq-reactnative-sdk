appId: ai.luciq.react.example
---
# Maestro test flow for both iOS and Android

- launchApp
- tapOn:
    id: instabug_floating_button
- assertVisible: 'Report a bug'
- tapOn: 'Report a bug'
# When the dashboard has report categories, the SDK lists them before the form.
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Others'
    commands:
      - tapOn: 'Others'
      - tapOn: 'My overall experience'
- tapOn:
    id: instabug_edit_text_email
- inputText: 'rn_e2e@luciq.ai'
- pressKey: Back
- tapOn:
    id: instabug_bugreporting_send
- assertVisible: 'Thank you!'
